name: Publish Docker image (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/leandrawisnu/grafika-intelligent-scheduling-backend

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          port: ${{ secrets.VM_PORT || 22 }}
          key: ${{ secrets.VM_SSH_KEY }}
          host_key: ${{ secrets.VM_KNOWN_HOSTS }}
          envs: VM_DEPLOY_DIR, VM_DEPLOY_CMD
          script: |
            set -e
            DIR="${VM_DEPLOY_DIR:-$HOME/grafika-intelligent-scheduling-backend}"
            if [ -d "$DIR/.git" ]; then
              cd "$DIR"
              git fetch origin
              git checkout -f main
              git reset --hard origin/main
            elif [ ! -d "$DIR" ] || [ -z "$(ls -A "$DIR" 2>/dev/null)" ]; then
              git clone https://github.com/leandrawisnu/grafika-intelligent-scheduling-backend.git "$DIR"
            else
              echo "[$DIR] bukan repo git — lewati sync"
            fi
            if [ -n "${VM_DEPLOY_CMD:-}" ]; then
              sh -c "$VM_DEPLOY_CMD"
            else
              (cd "$DIR" && docker compose up -d --build)
            fi
