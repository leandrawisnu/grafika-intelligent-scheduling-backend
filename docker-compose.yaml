# Start order (dev):
#   1. docker network create main-network   (once, jika pakai ML/FE di jaringan yang sama)
#   2. docker compose -f docker-compose.db.yaml up -d   (Postgres di host)
#   3. go run ./src -migrate init   atau  make migrate-init
#   4. Backend (web-api) — ini file compose API
#   5. ML / frontend (repo terpisah) bila ada

version: "3.5"

services:
  web-api:
    container_name: web-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:${APP_PORT:-8080}"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=${APP_PORT:-8080}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://host.docker.internal:8000}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_USER=${DB_USER:-grafika}
      - DB_PASSWORD=${DB_PASSWORD:-grafika_dev}
      - DB_NAME=${DB_NAME:-grafika}
      - DB_PORT=${DB_PORT:-5433}
      - TZ=Asia/Jakarta
      - GIS_AUTO_MIGRATE=${GIS_AUTO_MIGRATE:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$$APP_PORT/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
        mode: non-blocking

networks:
  default:
    name: main-network
    external: true
