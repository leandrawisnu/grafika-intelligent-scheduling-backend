# Standalone backend + Postgres (dev / uji repo ini saja).
# Full stack VM (Caddy + FE + ML): gunakan ../../docker-compose.yaml dari folder GIS/
#
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#   curl http://127.0.0.1:8080/health
#
# Expose publik (stress test dari luar VM):
#   APP_BIND=0.0.0.0 docker compose up -d --build
#   curl http://<IP-VM>:8080/health
#
# Postgres saja (kompatibel make db-up):
#   docker compose -f docker-compose.db.yaml up -d

name: gis-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: gis-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-grafika}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grafika_dev}
      POSTGRES_DB: ${DB_NAME:-grafika}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - gis_backend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-grafika} -d ${DB_NAME:-grafika}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: gis-backend-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-grafika}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-grafika_minio_dev}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - gis_backend_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gis-backend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-grafika}
      DB_PASSWORD: ${DB_PASSWORD:-grafika_dev}
      DB_NAME: ${DB_NAME:-grafika}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://host.docker.internal:8000}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-grafika}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-grafika_minio_dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-gis}
      MINIO_USE_SSL: "false"
      GIS_MODULE_ROOT: /app
      GIS_SKIP_MIGRATE: ${GIS_SKIP_MIGRATE:-false}
      TZ: ${TZ:-Asia/Jakarta}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:${APP_PORT:-8080}/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  gis_backend_pgdata:
  gis_backend_minio:
